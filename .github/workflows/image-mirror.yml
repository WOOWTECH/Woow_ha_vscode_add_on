name: image-mirror

# Nightly image sync: reads .mirror/image-map.json (produced by patch-image.py
# during mirror-sync) and copies each upstream image to ghcr.io/woowtech/ha-mirror-*.
#
# Two image patterns are supported (matching HA Supervisor semantics):
#   1. `image: foo/bar/{arch}` — per-arch tag. Substitute {arch} for each
#      supported arch, copy each one individually.
#   2. `image: foo/bar`         — single multi-arch OCI image index. Copy once
#      with `skopeo --all` and let the manifest list carry all arches.

on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:
    inputs:
      only_addon_dir:
        description: 'Optional: mirror only this addon dir (blank = all)'
        required: false
        default: ''

concurrency:
  group: image-mirror
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  mirror-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install skopeo + jq
        run: |
          sudo apt-get update -q
          sudo apt-get install -y skopeo jq

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Read image map + iterate
        env:
          ONLY: ${{ github.event.inputs.only_addon_dir }}
        run: |
          set -euo pipefail
          if [ ! -f .mirror/image-map.json ]; then
            echo "::error::.mirror/image-map.json missing — run mirror-sync first"
            exit 1
          fi

          copy_one() {
            # copy_one <src> <dst> <fatal-on-fail?>
            local src="$1" dst="$2" fatal="$3"
            if skopeo copy --all --retry-times 3 \
                "docker://${src}" "docker://${dst}"; then
              copied=$((copied + 1))
              return 0
            fi
            if [ "$fatal" = "1" ]; then
              echo "::warning::copy failed: ${src}"
              fail=$((fail + 1))
            else
              echo "::warning::copy failed: ${src} (non-fatal, e.g. :latest may not exist upstream)"
              skipped=$((skipped + 1))
            fi
            return 1
          }

          fail=0
          copied=0
          skipped=0
          count=$(jq -r '.addons | length' .mirror/image-map.json)
          echo "Addons in map: $count"

          for i in $(seq 0 $((count - 1))); do
            dir=$(jq -r ".addons[$i].dir"            .mirror/image-map.json)
            up=$(jq  -r ".addons[$i].upstream_image" .mirror/image-map.json)
            ver=$(jq -r ".addons[$i].version // \"\"" .mirror/image-map.json)
            arches=$(jq -r ".addons[$i].arches | join(\" \")" .mirror/image-map.json)
            new=$(jq  -r ".addons[$i].new_image"     .mirror/image-map.json)

            if [ -n "$ONLY" ] && [ "$dir" != "$ONLY" ]; then
              continue
            fi
            if [ -z "$up" ] || [ "$up" = "null" ]; then
              continue
            fi
            if [ -z "$ver" ] || [ "$ver" = "null" ]; then
              echo "  ⚠ $dir: no version, will only tag :latest"
              ver=""
            fi

            echo "----"
            echo "  $dir"
            echo "  upstream: $up  version=$ver  arches=$arches"
            echo "  mirror:   $new"

            if [[ "$up" == *"{arch}"* ]]; then
              # Pattern 1: per-arch tag — loop each arch, substitute {arch}.
              for arch in $arches; do
                src_base="${up//\{arch\}/$arch}"
                dst_base="${new//\{arch\}/$arch}"
                if [ -n "$ver" ]; then
                  copy_one "${src_base}:${ver}"    "${dst_base}:${ver}"    1 || true
                fi
                copy_one   "${src_base}:latest"    "${dst_base}:latest"    0 || true
              done
            else
              # Pattern 2: single multi-arch image index — one copy carries all arches.
              if [ -n "$ver" ]; then
                copy_one "${up}:${ver}"    "${new}:${ver}"    1 || true
              fi
              copy_one   "${up}:latest"    "${new}:latest"    0 || true
            fi
          done

          echo "----"
          echo "Copied=$copied  Skipped=$skipped  Failed=$fail"
          exit $fail
